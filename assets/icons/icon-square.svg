  <rect x="22" y="22" width="16" height="16" rx="4" fill="#8FB0DD"/>
  <rect x="22" y="42" width="16" height="16" rx="4" fill="#3E5F8C"/>
  <rect x="22" y="62" width="16" height="16" rx="4" fill="#26354B"/>
  <rect x="42" y="62" width="16" height="16" rx="4" fill="#3E5F8C"/>
  <rect x="62" y="62" width="16" height="16" rx="4" fill="#8FB0DD"/>
</svg>
