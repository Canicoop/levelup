<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Maskable app icon: full square, cells scaled to 80% around the centre so they stay
       inside the safe zone (a circle of 80% diameter). Source of icon-maskable-512.png. -->
  <rect width="100" height="100" fill="#121314"/>
  <g transform="translate(50 50) scale(0.8) translate(-50 -50)">
    <rect x="22" y="22" width="16" height="16" rx="4" fill="#8FB0DD"/>
    <rect x="22" y="42" width="16" height="16" rx="4" fill="#3E5F8C"/>
    <rect x="22" y="62" width="16" height="16" rx="4" fill="#26354B"/>
    <rect x="42" y="62" width="16" height="16" rx="4" fill="#3E5F8C"/>
    <rect x="62" y="62" width="16" height="16" rx="4" fill="#8FB0DD"/>
  </g>
</svg>
